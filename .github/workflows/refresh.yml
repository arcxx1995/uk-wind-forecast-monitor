name: Refresh Elexon snapshot

on:
  # GitHub's scheduled runs are best-effort (often 10 min to hours late), so several runs cover the pre-gate window.
  # Last pre-gate WINDFOR: 09:30 UTC in GMT (gate 11:00 UTC), 08:30 UTC in BST (gate 10:00 UTC).
  schedule:
    - cron: "40 8 * * *"   # BST: after the 08:30 UTC wind forecast
    - cron: "40 9 * * *"   # GMT: after the 09:30 UTC wind forecast
    - cron: "10 10 * * *"
    - cron: "35 10 * * *"
    - cron: "30 0 * * *"   # complete yesterday's actuals
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: Commit changed partitions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Elexon snapshot"
            git push
          fi
