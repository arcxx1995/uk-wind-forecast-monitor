name: Refresh Elexon snapshot

on:
  schedule:
    - cron: "45 9 * * *"  # after the ~08:45 NDF and 09:30 WINDFOR runs, before the 11:00 UK gate (GMT and BST)
    - cron: "30 0 * * *"  # complete yesterday's actuals
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: Commit changed partitions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Elexon snapshot"
            git push
          fi
